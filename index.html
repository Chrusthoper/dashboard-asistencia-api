<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;--bg2:#13161d;--bg3:#1a1e28;--bg4:#20263a;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#e8eaf0;--muted:#6b7280;--muted2:#9ca3af;
  --red:#f43f5e;--red-dim:rgba(244,63,94,0.12);
  --amber:#f59e0b;--amb-dim:rgba(245,158,11,0.12);
  --green:#10b981;--grn-dim:rgba(16,185,129,0.12);
  --blue:#3b82f6;--blu-dim:rgba(59,130,246,0.12);
  --purple:#8b5cf6;--pur-dim:rgba(139,92,246,0.12);
  --accent:#6366f1;--acc-dim:rgba(99,102,241,0.15);
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;min-height:100vh}
.hidden{display:none!important}

/* LOGIN */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:36px 32px;width:100%;max-width:420px}
.login-logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#818cf8);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 20px}
.login-title{text-align:center;font-size:20px;font-weight:600;margin-bottom:4px}
.login-sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:28px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.role-btn{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px 12px;cursor:pointer;transition:all .2s;text-align:center}
.role-btn:hover,.role-btn.selected{border-color:var(--accent);background:var(--acc-dim)}
.role-btn.selected{border-width:2px}
.role-icon{font-size:22px;margin-bottom:6px}
.role-name{font-size:12px;font-weight:500}
.role-desc{font-size:10px;color:var(--muted);margin-top:2px}
.login-btn{width:100%;padding:12px;border-radius:8px;background:var(--accent);border:none;color:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:opacity .2s}
.login-btn:hover{opacity:.85}
.login-btn:disabled{opacity:.4;cursor:not-allowed}

/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:12px}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#818cf8);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.header-title{font-size:14px;font-weight:600}
.header-sub{font-size:11px;color:var(--muted)}
.header-right{display:flex;align-items:center;gap:8px}
.role-badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500}
.logout-btn{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--muted);cursor:pointer;font-size:11px;font-family:inherit;transition:all .2s}
.logout-btn:hover{color:var(--text)}

/* NAV */
.nav{display:flex;gap:2px;padding:12px 20px 0;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto}
.nav-tab{padding:8px 16px;border-radius:8px 8px 0 0;font-size:12px;cursor:pointer;color:var(--muted);border:1px solid transparent;border-bottom:none;white-space:nowrap;transition:all .15s}
.nav-tab.active{background:var(--bg);color:var(--text);font-weight:500;border-color:var(--border);border-bottom-color:var(--bg)}

/* CONTENT */
.content{padding:16px 20px 24px}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.card-tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500}

/* GRIDS */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.kpi-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.kpi-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.kpi-val{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1}
.kpi-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:5px}
.mini-progress{height:3px;background:var(--bg3);border-radius:2px;margin-top:8px}
.mini-fill{height:3px;border-radius:2px}

/* FILTER BAR */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filter-btn{padding:5px 12px;border-radius:20px;font-size:11px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);cursor:pointer;transition:all .15s;font-family:inherit}
.filter-btn.active,.filter-btn:hover{border-color:var(--accent);color:var(--text);background:var(--acc-dim)}
.filter-btn.active{font-weight:500}
.filter-label{font-size:11px;color:var(--muted);margin-right:4px}

/* TABLE */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{padding:7px 10px;text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid rgba(255,255,255,0.04);transition:background .1s;cursor:pointer}
tbody tr:hover{background:rgba(255,255,255,0.03)}
tbody td{padding:8px 10px}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:500}

/* AREA BARS */
.area-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.area-row:last-child{margin-bottom:0}
.area-name{width:90px;font-size:12px;flex-shrink:0}
.area-track{flex:1;height:24px;background:var(--bg3);border-radius:6px;position:relative;overflow:visible;cursor:pointer}
.area-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;font-size:11px;font-weight:500}
.ref-line{position:absolute;left:60%;top:-4px;bottom:-4px;width:1px;background:rgba(255,255,255,0.15);z-index:2}
.ref-label{position:absolute;top:-18px;left:-12px;font-size:9px;color:var(--muted);white-space:nowrap}

/* RISK ITEMS */
.risk-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:var(--bg3);margin-bottom:6px;cursor:pointer;transition:background .15s}
.risk-item:hover{background:var(--bg4)}
.risk-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* SOLICITUDES */
.sol-item{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;transition:border-color .2s}
.sol-item:hover{border-color:var(--border2)}
.sol-name{font-size:13px;font-weight:500}
.sol-meta{font-size:11px;color:var(--muted);margin-top:2px}
.sol-body{font-size:12px;color:var(--muted2);line-height:1.6;margin:8px 0}
.sol-actions{display:flex;gap:8px;flex-wrap:wrap}

/* HISTORIAL ACCIONES */
.action-log{background:var(--bg3);border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.action-icon{font-size:16px;flex-shrink:0}
.action-text{font-size:12px;color:var(--text)}
.action-sub{font-size:11px;color:var(--muted)}
.action-time{font-size:10px;color:var(--muted);font-family:monospace;margin-left:auto;flex-shrink:0}

/* BTNS */
.btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:all .2s}
.btn-green{background:var(--grn-dim);color:var(--green);border:1px solid rgba(16,185,129,0.3)}
.btn-green:hover{background:rgba(16,185,129,.2)}
.btn-red{background:var(--red-dim);color:var(--red);border:1px solid rgba(244,63,94,0.3)}
.btn-red:hover{background:rgba(244,63,94,.2)}
.btn-blue{background:var(--blu-dim);color:var(--blue);border:1px solid rgba(59,130,246,0.3)}
.btn-blue:hover{background:rgba(59,130,246,.2)}
.btn-ghost{background:var(--bg3);color:var(--muted2);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--border2);color:var(--text)}
.btn-accent{background:var(--accent);color:#fff;border:1px solid transparent}
.btn-accent:hover{opacity:.85}
.btn-amber{background:var(--amb-dim);color:var(--amber);border:1px solid rgba(245,158,11,0.3)}

/* FORM */
.form-group{margin-bottom:14px}
.form-label{font-size:11px;font-weight:500;color:var(--muted2);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.04em}
.form-input,.form-select,.form-textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;transition:border-color .2s;outline:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-select option{background:var(--bg3)}
.form-textarea{resize:vertical;min-height:80px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:24px;width:100%;max-width:500px;transform:translateY(8px);transition:transform .2s;max-height:90vh;overflow-y:auto}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-title{font-size:15px;font-weight:600;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* NOTIFICATION */
.notif{position:fixed;top:70px;right:16px;background:var(--bg2);border:1px solid var(--border2);border-left-width:3px;border-radius:10px;padding:12px 16px;font-size:12px;z-index:999;opacity:0;transform:translateY(-8px);transition:all .3s;pointer-events:none;max-width:300px;line-height:1.5}
.notif.show{opacity:1;transform:translateY(0)}

/* TIMELINE */
.tl{padding-left:16px}
.tl-item{position:relative;margin-bottom:14px;padding-left:20px}
.tl-dot{position:absolute;left:-8px;top:4px;width:8px;height:8px;border-radius:50%}
.tl-line{position:absolute;left:-4px;top:12px;bottom:-14px;width:1px;background:var(--border)}
.tl-item:last-child .tl-line{display:none}
.tl-title{font-size:12px;font-weight:500}
.tl-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* NARRATIVE */
.narrative{background:linear-gradient(135deg,rgba(99,102,241,0.08),rgba(244,63,94,0.06));border:1px solid rgba(99,102,241,0.2);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:12px;color:#a5b4fc;line-height:1.6}
.narrative strong{color:var(--text)}

/* DRILL DOWN */
.drill-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--bg3);margin-bottom:5px;cursor:pointer;transition:background .15s}
.drill-item:hover{background:var(--bg4)}

/* BADGE PENDIENTE */
.pending-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;font-weight:700;margin-left:5px}

/* STAT ROW */
.stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat-box{background:var(--bg3);border-radius:8px;padding:10px 14px;flex:1;min-width:70px}
.stat-val{font-size:20px;font-weight:600;font-family:monospace}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:2px}

/* FLUJO APROBACION */
.flow{display:flex;align-items:center;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.flow-step{padding:6px 10px;border-radius:6px;font-size:11px;font-weight:500;flex:1;text-align:center}
.flow-arrow{color:var(--muted);font-size:14px;flex-shrink:0}

/* PRED */
.pred-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.pred-row:last-child{border:none}
.pred-week{font-size:11px;color:var(--muted);width:75px;flex-shrink:0}
.pred-bars{flex:1;display:flex;gap:4px}
.pred-area{flex:1;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;position:relative;cursor:pointer;transition:opacity .15s}
.pred-area:hover{opacity:.8}
</style>
</head>
<body>

<div class="notif" id="notif"></div>
<div class="modal-overlay" id="modal"><div class="modal">
  <div class="modal-title" id="mt"></div>
  <div class="modal-sub" id="ms"></div>
  <div id="mb"></div>
  <div class="modal-actions" id="ma"></div>
</div></div>

<!-- LOGIN -->
<div id="login-screen" class="login-screen">
  <div class="login-box">
    <div class="login-logo">📊</div>
    <div class="login-title">IT Workforce Intelligence</div>
    <div class="login-sub">Selecciona tu perfil para continuar</div>
    <div class="role-grid">
      <div class="role-btn" onclick="selectRole('ceo',this)"><div class="role-icon">👔</div><div class="role-name">CEO</div><div class="role-desc">Vista ejecutiva</div></div>
      <div class="role-btn" onclick="selectRole('rh',this)"><div class="role-icon">👥</div><div class="role-name">Recursos Humanos</div><div class="role-desc">Gestión completa</div></div>
      <div class="role-btn" onclick="selectRole('supervisor',this)"><div class="role-icon">🖥️</div><div class="role-name">Supervisor IT</div><div class="role-desc">Mi área + aprobaciones</div></div>
      <div class="role-btn" onclick="selectRole('empleado',this)"><div class="role-icon">👤</div><div class="role-name">Empleado</div><div class="role-desc">Mi perfil y permisos</div></div>
    </div>
    <button class="login-btn" id="login-btn" disabled onclick="doLogin()">Ingresar al sistema</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="header">
    <div class="header-left">
      <div class="logo">📊</div>
      <div><div class="header-title">IT Workforce Intelligence</div><div class="header-sub" id="hsub">Abril 2026</div></div>
    </div>
    <div class="header-right">
      <div class="role-badge" id="rbadge"></div>
      <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>
  <div class="nav" id="nav"></div>
  <div class="content" id="content"></div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
let role=null, tab=0;
let actionLog=[];

let solicitudes=[
  {id:1,emp:'Diego Romero',area:'IT Support',tipo:'Médico',subtipo:'Enfermedad propia',dias:5,inicio:'2026-05-05',motivo:'Consulta médica y reposo por diagnóstico de gripe severa con complicaciones respiratorias.',status:'pendiente',etapa:'supervisor',prioridad:'alta'},
  {id:2,emp:'Ana Salas',area:'IT Support',tipo:'Vacaciones',subtipo:'Vacaciones acumuladas',dias:15,inicio:'2026-05-20',motivo:'Solicito hacer uso de mis 15 días de vacaciones acumuladas antes de su fecha de vencimiento el 19 de mayo.',status:'pendiente',etapa:'supervisor',prioridad:'alta'},
  {id:3,emp:'Hugo Vega',area:'DevOps',tipo:'Personal',subtipo:'Asuntos familiares',dias:3,inicio:'2026-05-12',motivo:'Necesito atender situación familiar urgente. Mi padre requiere acompañamiento médico.',status:'aprobado_supervisor',etapa:'rh',prioridad:'media'},
  {id:4,emp:'Gabriela Romero',area:'IT Support',tipo:'Médico',subtipo:'Maternidad',dias:84,inicio:'2026-06-01',motivo:'Permiso de maternidad conforme a la Ley Federal del Trabajo, Art. 170.',status:'pendiente',etapa:'supervisor',prioridad:'alta'},
  {id:5,emp:'Carlos Salas',area:'IT Support',tipo:'Personal',subtipo:'Trámites legales',dias:2,inicio:'2026-05-08',motivo:'Trámites notariales que requieren presencia física en horario de oficina.',status:'denegado',etapa:'cerrado',prioridad:'baja'},
  {id:6,emp:'Laura Mendoza',area:'Networking',tipo:'Médico',subtipo:'Cuidado de hijos',dias:4,inicio:'2026-05-14',motivo:'Mi hijo menor requiere hospitalización y cuidados. Solicito permiso por incapacidad familiar.',status:'aprobado',etapa:'cerrado',prioridad:'media'},
];
let miSolicitud=null;
let areaFiltro='all', riesgoFiltro='all';

let datosKPIs = {
  capacidad: 39,
  activos: 39,
  total: 100,
  asistencia: 86.8,
  enRiesgo: 14,
  areaCritica: 'IT',
  areaCriticaPct: 78.7
};

async function cargarKPIs() {
  try {
    const respuesta = await fetch('https://dashboard-asistencia-api.onrender.com/api/asistencia');
    const datos = await respuesta.json();
    
    // Mapeamos los datos de la API a nuestra estructura
    datosKPIs = {
      capacidad: Math.round((datos.total_empleados - datos.empleados_bajo_60) / datos.total_empleados * 100),
      activos: datos.total_empleados - datos.empleados_bajo_60,
      total: datos.total_empleados,
      asistencia: datos.asistencia_promedio,
      enRiesgo: datos.empleados_bajo_60,
      areaCritica: datos.area_critica.split(' ')[0], // "IT" de "IT Support"
      areaCriticaPct: 78.7 // Por ahora hardcodeado, luego vendrá de la API
    };
    
    console.log('KPIs cargados desde API:', datosKPIs);
  } catch (error) {
    console.error('Error al cargar KPIs, usando valores por defecto:', error);
  }
}

const AREAS=[
  {name:'IT Support',pct:78.7,bajo60:6,activos:8,color:'#f43f5e'},
  {name:'Networking',pct:87.0,bajo60:2,activos:10,color:'#3b82f6'},
  {name:'DevOps',pct:91.1,bajo60:4,activos:11,color:'#10b981'},
  {name:'Security',pct:91.4,bajo60:2,activos:10,color:'#10b981'},
];
const RIESGO=[
  {n:'Diego Romero',a:'IT Support',pct:40.9,est:'Activo',r:'critico',vac:15,perm:6,tipo:'Médico — Enfermedad'},
  {n:'Gabriela Romero',a:'IT Support',pct:45.5,est:'Activo',r:'critico',vac:10,perm:7,tipo:'Médico — Maternidad'},
  {n:'Mariana Salas',a:'DevOps',pct:45.5,est:'Activo',r:'critico',vac:0,perm:3,tipo:'No registrado'},
  {n:'Carlos Salas',a:'IT Support',pct:45.5,est:'Permiso',r:'alto',vac:8,perm:5,tipo:'Personal — Trámites'},
  {n:'Ana Salas',a:'IT Support',pct:50.0,est:'Vacaciones',r:'alto',vac:15,perm:5,tipo:'Vacaciones acumuladas'},
  {n:'Juan Diaz',a:'Security',pct:50.0,est:'Vacaciones',r:'alto',vac:16,perm:6,tipo:'Vacaciones anuales'},
  {n:'Laura Mendoza',a:'Networking',pct:54.5,est:'Permiso',r:'alto',vac:2,perm:6,tipo:'Médico — Hijos'},
  {n:'Hugo Vega',a:'DevOps',pct:59.1,est:'Permiso',r:'moderado',vac:5,perm:3,tipo:'Personal — Familiar'},
  {n:'Diego Ruiz',a:'DevOps',pct:59.1,est:'Permiso',r:'moderado',vac:11,perm:2,tipo:'Personal'},
];

// ── UTILS ─────────────────────────────────────────────────────────────────────
const rc=r=>r==='critico'?'var(--red)':r==='alto'?'var(--amber)':'var(--blue)';
const now=()=>{const d=new Date();return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`};

const statusPill=s=>{
  if(s==='pendiente') return `<span class="pill" style="background:var(--amb-dim);color:var(--amber)">⏳ Pendiente</span>`;
  if(s==='aprobado_supervisor') return `<span class="pill" style="background:var(--blu-dim);color:var(--blue)">✓ Sup. → RH pendiente</span>`;
  if(s==='aprobado') return `<span class="pill" style="background:var(--grn-dim);color:var(--green)">✓ Aprobado</span>`;
  return `<span class="pill" style="background:var(--red-dim);color:var(--red)">✗ Denegado</span>`;
};

function notify(msg,color='var(--green)'){
  const n=document.getElementById('notif');
  n.innerHTML=msg; n.style.borderLeftColor=color;
  n.classList.add('show');
  setTimeout(()=>n.classList.remove('show'),3500);
}

function openModal(title,sub,body,actions){
  document.getElementById('mt').textContent=title;
  document.getElementById('ms').textContent=sub;
  document.getElementById('mb').innerHTML=body;
  document.getElementById('ma').innerHTML=actions;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open')}

function logAction(icon,text,sub,color){
  actionLog.unshift({icon,text,sub,color,time:now()});
  if(actionLog.length>8) actionLog.pop();
}

// ── AUTH ──────────────────────────────────────────────────────────────────────
function selectRole(r,el){
  role=r;
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('selected'));

const TABS={
  ceo:['📊 Resumen','🔍 Drill-down áreas','📅 Predicción 60 días'],
  rh:['📊 General','👥 Colaboradores','📋 Solicitudes','📅 Predicción','🕐 Historial'],
  supervisor:['📊 Mi Área','👥 Mi Equipo','📋 Aprobaciones','📅 Cobertura'],
  empleado:['👤 Mi Perfil','📝 Solicitar Permiso','📋 Mis Solicitudes'],
};

function pendingSup(){return solicitudes.filter(s=>s.status==='pendiente'&&s.etapa==='supervisor').length}
function pendingRH(){return solicitudes.filter(s=>s.status==='pendiente'||s.status==='aprobado_supervisor').length}

function buildNav(){
  const tabs=TABS[role];
  if(!tabs){ return; }
  document.getElementById('nav').innerHTML=tabs.map((t,i)=>{
    let badge='';
    if(role==='supervisor'&&i===2&&pendingSup()>0) badge=`<span class="pending-badge">${pendingSup()}</span>`;
    if(role==='rh'&&i===2&&pendingRH()>0) badge=`<span class="pending-badge">${pendingRH()}</span>`;
    return `<div class="nav-tab ${i===0?'active':''}" onclick="renderTab(${i})">${t}${badge}</div>`;
  }).join('');
}

function renderTab(i){
  tab=i;
  document.querySelectorAll('.nav-tab').forEach((t,j)=>t.classList.toggle('active',j===i));
  const renders={
    ceo:[renderCEOResumen,renderCEODrill,renderCEOPrediccion],
    rh:[renderRHGeneral,renderRHColaboradores,renderRHSolicitudes,renderRHPrediccion,renderRHHistorial],
    supervisor:[renderSupArea,renderSupEquipo,renderSupAprobaciones,renderSupCobertura],
    empleado:[renderEmpPerfil,renderEmpSolicitar,renderEmpMisSolicitudes],
  };
  const fn=renders[role] && renders[role][i];
  if(typeof fn!=='function'){ return; }
  fn();
}

function resolver(id, accion, rolVista){
  const s=solicitudes.find(x=>x.id===id);
  openModal(
    `${accion==='aprobado'?'Aprobar':'Denegar'} permiso de ${s.emp}`,
    `${s.tipo} — ${s.subtipo} · ${s.dias} días`,
    `<div style="font-size:12px;color:var(--muted2);margin-bottom:14px;padding:10px;background:var(--bg3);border-radius:8px;line-height:1.6">"${s.motivo}"</div>
    ${rolVista==='supervisor'&&accion==='aprobado'?`<div style="font-size:11px;color:var(--blue);margin-bottom:12px;padding:8px 10px;background:var(--blu-dim);border-radius:6px">Tu aprobación enviará esta solicitud a RH para validación final antes de confirmar.</div>`:''}
    <div class="form-group"><label class="form-label">Comentario para el empleado</label><textarea class="form-textarea" id="com-modal" placeholder="Agrega una nota explicativa (opcional)..."></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
     <button class="btn ${accion==='aprobado'?'btn-green':'btn-red'}" onclick="confirmar(${id},'${accion}','${rolVista}')">${accion==='aprobado'?'✓ Confirmar':'✗ Confirmar denegación'}</button>`
  );
}

function confirmar(id, accion, rolVista){
  const s=solicitudes.find(x=>x.id===id);
  if(accion==='aprobado'&&rolVista==='supervisor'){
    s.status='aprobado_supervisor'; s.etapa='rh';
    logAction('✓',`Permiso de ${s.emp} aprobado por Supervisor`,`Enviado a RH · ${s.tipo}`,'var(--blue)');
    notify(`✓ Aprobación enviada a RH para validación final de ${s.emp}`, 'var(--blue)');
  } else {
    s.status=accion; s.etapa='cerrado';
    logAction(accion==='aprobado'?'✓':'✗',`Permiso de ${s.emp} ${accion}`,`${s.tipo} · ${s.dias} días`,accion==='aprobado'?'var(--green)':'var(--red)');
    notify(`${accion==='aprobado'?'✓ Permiso aprobado':'✗ Permiso denegado'} — ${s.emp}`, accion==='aprobado'?'var(--green)':'var(--red)');
  }
  closeModal();
  buildNav();
  renderTab(tab);
}

function updateSubtipo(){
  const t=document.getElementById('tipo').value;
  const map={'Médico':['Enfermedad propia','Cita médica','Hospitalización familiar','Cuidado de hijos'],'Vacaciones':['Vacaciones anuales','Vacaciones acumuladas'],'Personal':['Trámites legales','Asuntos familiares','Mudanza','Otro'],'Maternidad/Paternidad':['Maternidad (84 días)','Paternidad (5 días)'],'Sindical':['Representación sindical','Congreso','Otro']};
  const g=document.getElementById('subtipo-g');
  if(t&&map[t]){g.classList.remove('hidden');document.getElementById('subtipo').innerHTML=map[t].map(s=>`<option>${s}</option>`).join('');}
  else g.classList.add('hidden');
}

function enviarSolicitud(){
  const tipo=document.getElementById('tipo').value;
  const dias=document.getElementById('ndias').value;
  const motivo=document.getElementById('motivo').value;
  const fecha=document.getElementById('fecha-i').value;
  if(!tipo||!dias||!motivo||!fecha){notify('⚠ Completa todos los campos requeridos','var(--red)');return;}
  const sub=document.getElementById('subtipo')?.value||'-';
  miSolicitud={id:solicitudes.length+1,emp:'Mi perfil',area:'IT Support',tipo,subtipo:sub,dias:parseInt(dias),inicio:fecha,motivo,status:'pendiente',etapa:'supervisor',prioridad:'media'};
  solicitudes.push(miSolicitud);
  logAction('📝',`Solicitud enviada — ${tipo}`,`${dias} días desde ${fecha}`,'var(--green)');
  notify('✓ Solicitud enviada a tu supervisor. Te notificaremos cuando haya una respuesta.','var(--green)');
  setTimeout(()=>renderTab(2),600);
}
